# Minimal squid config for the graph_conn proxy tests.
# Permissive: allows CONNECT to the mock graph server on 8081 and any client to
# use the proxy. Not suitable for non-test use.

acl SSL_ports port 443
acl SSL_ports port 8081
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 8081
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow all

http_port 3128

coredump_dir /var/spool/squid

# An IPv4-only copy of /etc/hosts, built by the entrypoint in docker-compose.test.yaml.
# Docker Desktop also gives the host an AAAA record, and squid prefers it over the A
# record the mock graph server actually listens on.
hosts_file /tmp/hosts
